[project]
name = "cp4285-recommender-study"
version = "0.1.0"
description = "Dataset audits and an A-only continued-training pilot for CP4285"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "torch>=2.6,<3",
]

[project.scripts]
cp4285 = "cp4285.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp4285"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
