[project]
name = "cp4285-recommender-study"
version = "0.1.0"
description = "Shared experiment contracts and extensible recommender research models"
readme = "README.md"
license-files = ["licenses/*.txt", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.6,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "neural" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp4285"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
