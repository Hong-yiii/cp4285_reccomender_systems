[project]
name = "cp4285-recommender-study"
version = "0.1.0"
description = "Shared experiment contracts and extensible recommender research models"
readme = "README.md"
license-files = ["licenses/*.txt", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
neural = [
  "torch==2.14.1+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
]
neural-cuda = [
  "torch==2.14.1+cu126; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv]
conflicts = [[{ extra = "neural" }, { extra = "neural-cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "neural" },
  { index = "pytorch-cu126", extra = "neural-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp4285"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
