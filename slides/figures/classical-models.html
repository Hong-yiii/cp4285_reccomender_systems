<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classical models</title>
<!--
  One-slide summary of the classical models (src/cp4285/classical/models.py, docs/CLASSICAL.md):
  Popularity, Markov chain and the QR model (Markov chain compressed to k patterns).
  Colours follow the team deck: Electronics #1a6bb8, Movies & TV #bfbfbf, cards #f2f2f2.
  16:9 at 1920x1080. Export:
    chrome --headless --screenshot=classical-models.png --window-size=1920,1080 \
           --force-device-scale-factor=2 --hide-scrollbars classical-models.html
-->
<style>
  html, body { margin: 0; background: #fff; }
  body { display: grid; place-items: center; min-height: 100vh; }
  svg { display: block; font-family: Arial, Helvetica, sans-serif; }
  .slide-title { font-size: 72px; fill: #000; }
  .card-title { font-size: 44px; font-weight: 700; fill: #1a1a1a; }
  .card-sub { font-size: 30px; fill: #595959; }
  .label { font-size: 28px; fill: #1a1a1a; }
  .small { font-size: 24px; fill: #595959; }
  .caption { font-size: 30px; fill: #1a1a1a; }
  .badge { font-size: 28px; font-weight: 700; }
  .band-title { font-size: 34px; font-weight: 700; fill: #1a1a1a; }
  .band-text { font-size: 30px; fill: #595959; }
  .band-strong { font-size: 30px; font-weight: 700; fill: #1a1a1a; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img"
     aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
  <title id="t">Classical models: count, then compress</title>
  <desc id="d">Popularity ranks products by review count. The Markov chain counts which product is reviewed right after each product and reads the row of the shopper's latest product. The QR model compresses that table into k = 256 shared patterns, so its size is fixed. When Movies &amp; TV is mixed in, Popularity and the Markov chain only add new entries, while the QR model must share the same k patterns between Electronics and Movies &amp; TV.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="18" markerHeight="18" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f7f7f"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#fff"/>

  <!-- Title -->
  <text class="slide-title" x="90" y="112">Classical models: count, then compress</text>

  <!-- Running example -->
  <text class="band-text" x="90" y="204">A shopper reviewed</text>
  <g>
    <rect x="380" y="166" width="130" height="54" rx="27" fill="#fff" stroke="#a6a6a6" stroke-width="2"/>
    <text class="label" x="445" y="203" text-anchor="middle">Phone</text>
    <line x1="518" y1="193" x2="566" y2="193" stroke="#7f7f7f" stroke-width="3" marker-end="url(#ah)"/>
    <rect x="576" y="166" width="120" height="54" rx="27" fill="#fff" stroke="#1a6bb8" stroke-width="3"/>
    <text class="label" x="636" y="203" text-anchor="middle" style="fill:#1a6bb8;font-weight:700">Case</text>
    <line x1="704" y1="193" x2="752" y2="193" stroke="#7f7f7f" stroke-width="3" marker-end="url(#ah)"/>
    <rect x="762" y="166" width="72" height="54" rx="27" fill="#fff" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="label" x="798" y="204" text-anchor="middle" style="font-weight:700">?</text>
  </g>
  <text class="band-text" x="860" y="204">Each model guesses what comes next.</text>

  <!-- ───────── Card 1: Popularity ───────── -->
  <rect x="90" y="250" width="540" height="520" rx="22" fill="#f2f2f2"/>
  <text class="card-title" x="120" y="312">Popularity</text>
  <text class="card-sub" x="120" y="354">count reviews per product</text>

  <g>
    <text class="label" x="120" y="421" style="font-weight:700">#1</text>
    <rect x="180" y="390" width="250" height="42" rx="4" fill="#1a6bb8"/>
    <text class="label" x="444" y="421">Charger</text>

    <text class="label" x="120" y="479" style="font-weight:700">#2</text>
    <rect x="180" y="448" width="200" height="42" rx="4" fill="#1a6bb8" fill-opacity="0.75"/>
    <text class="label" x="394" y="479">Cable</text>

    <text class="label" x="120" y="537" style="font-weight:700">#3</text>
    <rect x="180" y="506" width="150" height="42" rx="4" fill="#1a6bb8" fill-opacity="0.55"/>
    <text class="label" x="344" y="537">Earbuds</text>

    <text class="label" x="120" y="595" style="font-weight:700">#4</text>
    <rect x="180" y="564" width="105" height="42" rx="4" fill="#1a6bb8" fill-opacity="0.4"/>
    <text class="label" x="299" y="595">Mouse</text>
  </g>

  <text class="caption" x="120" y="668">Same top 10 for everyone</text>
  <rect x="120" y="698" width="480" height="52" rx="26" fill="#fff" stroke="#a6a6a6" stroke-width="2"/>
  <text class="badge" x="360" y="734" text-anchor="middle" fill="#1a1a1a">Grows with data</text>

  <!-- ───────── Card 2: Markov chain ───────── -->
  <rect x="690" y="250" width="540" height="520" rx="22" fill="#f2f2f2"/>
  <text class="card-title" x="720" y="312">Markov chain</text>
  <text class="card-sub" x="720" y="354">count what is reviewed next</text>

  <g>
    <!-- column headers: next product -->
    <text class="small" x="826" y="402" text-anchor="end" style="fill:#9e9e9e">next →</text>
    <g class="small" text-anchor="middle" style="fill:#1a1a1a">
      <text x="885"  y="402">Case</text>
      <text x="975"  y="402">Cable</text>
      <text x="1065" y="402">Charger</text>
      <text x="1155" y="402">Tripod</text>
    </g>
    <!-- grid -->
    <g fill="#fff" stroke="#d0d0d0" stroke-width="1.5">
      <rect x="840" y="415" width="90" height="50"/><rect x="930" y="415" width="90" height="50"/><rect x="1020" y="415" width="90" height="50"/><rect x="1110" y="415" width="90" height="50"/>
      <rect x="840" y="515" width="90" height="50"/><rect x="930" y="515" width="90" height="50"/><rect x="1020" y="515" width="90" height="50"/><rect x="1110" y="515" width="90" height="50"/>
      <rect x="840" y="565" width="90" height="50"/><rect x="930" y="565" width="90" height="50"/><rect x="1020" y="565" width="90" height="50"/><rect x="1110" y="565" width="90" height="50"/>
    </g>
    <!-- highlighted row: the shopper's latest product -->
    <g stroke="#d0d0d0" stroke-width="1.5">
      <rect x="840"  y="465" width="90" height="50" fill="#d6e4f3"/>
      <rect x="930"  y="465" width="90" height="50" fill="#1a6bb8"/>
      <rect x="1020" y="465" width="90" height="50" fill="#d6e4f3"/>
      <rect x="1110" y="465" width="90" height="50" fill="#d6e4f3"/>
    </g>
    <rect x="840" y="465" width="360" height="50" fill="none" stroke="#1a6bb8" stroke-width="3"/>
    <!-- row headers: last product -->
    <g class="label" text-anchor="end">
      <text x="826" y="449">Phone</text>
      <text x="826" y="499" style="fill:#1a6bb8;font-weight:700">Case</text>
      <text x="826" y="549">Camera</text>
      <text x="826" y="599">Tripod</text>
    </g>
    <!-- counts (most cells empty) -->
    <g class="label" text-anchor="middle">
      <text x="885"  y="449">58</text>
      <text x="975"  y="449">21</text>
      <text x="1065" y="449">12</text>
      <text x="975"  y="499" style="fill:#fff;font-weight:700">42</text>
      <text x="1065" y="499">17</text>
      <text x="1155" y="549">33</text>
    </g>
  </g>

  <text class="caption" x="720" y="668">Read your latest product’s row</text>
  <rect x="720" y="698" width="480" height="52" rx="26" fill="#fff" stroke="#a6a6a6" stroke-width="2"/>
  <text class="badge" x="960" y="734" text-anchor="middle" fill="#1a1a1a">Grows with data</text>

  <!-- Markov table feeds the QR model -->
  <line x1="1236" y1="505" x2="1282" y2="505" stroke="#7f7f7f" stroke-width="4" marker-end="url(#ah)"/>

  <!-- ───────── Card 3: QR model ───────── -->
  <rect x="1290" y="250" width="540" height="520" rx="22" fill="#f2f2f2"/>
  <text class="card-title" x="1320" y="312">QR model</text>
  <text class="card-sub" x="1320" y="354">the Markov table, compressed</text>

  <g>
    <!-- big sparse table -->
    <rect x="1320" y="410" width="160" height="160" fill="#fff" stroke="#a6a6a6" stroke-width="2"/>
    <g stroke="#e3e3e3" stroke-width="1">
      <line x1="1360" y1="410" x2="1360" y2="570"/><line x1="1400" y1="410" x2="1400" y2="570"/><line x1="1440" y1="410" x2="1440" y2="570"/>
      <line x1="1320" y1="450" x2="1480" y2="450"/><line x1="1320" y1="490" x2="1480" y2="490"/><line x1="1320" y1="530" x2="1480" y2="530"/>
    </g>
    <g fill="#9e9e9e">
      <rect x="1328" y="418" width="24" height="24"/><rect x="1368" y="418" width="24" height="24"/>
      <rect x="1368" y="458" width="24" height="24" fill="#1a6bb8"/>
      <rect x="1448" y="498" width="24" height="24"/>
      <rect x="1408" y="538" width="24" height="24"/>
    </g>
    <text class="small" x="1400" y="604" text-anchor="middle">368K × 368K</text>

    <text x="1510" y="506" text-anchor="middle" style="font-size:52px;fill:#1a1a1a">≈</text>

    <!-- products × k -->
    <rect x="1540" y="410" width="40" height="160" fill="#1a6bb8"/>
    <text class="label" x="1560" y="604" text-anchor="middle" style="fill:#1a6bb8;font-weight:700">k</text>

    <text x="1601" y="502" text-anchor="middle" style="font-size:40px;fill:#1a1a1a">×</text>

    <!-- k × products -->
    <rect x="1622" y="470" width="160" height="40" fill="#1a6bb8"/>
    <text class="label" x="1798" y="500" style="fill:#1a6bb8;font-weight:700">k</text>
    <text class="small" x="1702" y="548" text-anchor="middle">k patterns,</text>
    <text class="small" x="1702" y="578" text-anchor="middle">e.g. “camera gear”</text>
  </g>

  <text class="caption" x="1320" y="668">k tuned between 32 and 256</text>
  <rect x="1320" y="698" width="480" height="52" rx="26" fill="#1a1a1a"/>
  <text class="badge" x="1560" y="734" text-anchor="middle" fill="#fff">Fixed size</text>

  <!-- ───────── Bottom band: mixing in Movies & TV ───────── -->
  <text class="band-title" x="90" y="840">Mixing in Movies &amp; TV</text>

  <!-- Left: count tables just grow -->
  <g>
    <rect x="90"  y="866" width="140" height="90" fill="#1a6bb8"/>
    <rect x="230" y="866" width="140" height="90" fill="#f2f2f2"/>
    <rect x="90"  y="956" width="140" height="90" fill="#f2f2f2"/>
    <rect x="230" y="956" width="140" height="90" fill="#bfbfbf"/>
    <text x="160" y="918" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#fff">Electronics</text>
    <text x="300" y="1008" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#1a1a1a">Movies &amp; TV</text>
    <text x="300" y="920" text-anchor="middle" style="font-size:28px;fill:#9e9e9e">0</text>
    <text x="160" y="1010" text-anchor="middle" style="font-size:28px;fill:#9e9e9e">0</text>
  </g>
  <text class="band-strong" x="400" y="930">Popularity, Markov chain</text>
  <text class="band-text" x="400" y="972">Movies &amp; TV gets new entries;</text>
  <text class="band-text" x="400" y="1010">Electronics entries unchanged</text>

  <!-- Right: the same k patterns are shared -->
  <text class="band-strong" x="990" y="895">QR model: the same k patterns are shared</text>

  <text class="band-text" x="990" y="950">Electronics only</text>
  <g id="bar-clean"></g>
  <text class="band-text" x="990" y="1016">With Movies &amp; TV</text>
  <g id="bar-mixed"></g>
  <text x="1830" y="1068" text-anchor="end" style="font-size:22px;fill:#9e9e9e">Illustration: split not to scale</text>

  <script>
    // 16 blocks stand in for the k = 256 patterns; the mixed split is illustrative only.
    const NS = 'http://www.w3.org/2000/svg';
    function bar(id, y, blue) {
      const g = document.getElementById(id), x0 = 1252, w = 33, gap = 3;
      for (let i = 0; i < 16; i++) {
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x0 + i * (w + gap)); r.setAttribute('y', y);
        r.setAttribute('width', w); r.setAttribute('height', 40); r.setAttribute('rx', 3);
        r.setAttribute('fill', i < blue ? '#1a6bb8' : '#bfbfbf');
        g.appendChild(r);
      }
    }
    bar('bar-clean', 920, 16);
    bar('bar-mixed', 986, 9);
  </script>
</svg>
</body>
</html>
