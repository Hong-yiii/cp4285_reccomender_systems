<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hit and Recall</title>
<!--
  One top-10 list scored two ways, per the metric decision in issue #8 and the classical-study
  branch (PR #9, not yet run): next item -> Hit@10 (leave-last-out); next items -> Recall@10 =
  hits / min(10, number hidden), targets = first <= 10 new products reviewed in [T, T + 365 d),
  T = 2022-01-01, validation one year earlier. Window statistics from docs/CLASSICAL.md on that
  branch (Electronics 5-core). Shopper, products and ranks are illustrative.
  Export:
    chrome --headless --screenshot=next-item-vs-next-items.png --window-size=1920,1080 \
           --force-device-scale-factor=2 --hide-scrollbars next-item-vs-next-items.html
-->
<style>
  html, body { margin: 0; background: #fff; }
  body { display: grid; place-items: center; min-height: 100vh; }
  svg { display: block; font-family: Arial, Helvetica, sans-serif; }
  .title { font-size: 54px; fill: #000; }
  .card { fill: #f2f2f2; }
  .num { font-size: 26px; font-weight: 700; fill: #fff; }
  .head { font-size: 32px; font-weight: 700; fill: #1a1a1a; }
  .text { font-size: 24px; fill: #1a1a1a; }
  .muted { font-size: 24px; fill: #595959; }
  .small { font-size: 22px; fill: #595959; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img"
     aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
  <title id="t">Hit@10 scores the next review; Recall@10 the next year</title>
  <desc id="d">A shopper reviewed a laptop, phone and case before now; afterwards they review a cable, charger, tripod and mouse, which are hidden. The model's top 10 from the past contains the charger at 2 and the mouse at 7; the cable is at 14 and the tripod at 31. Next item: only the first hidden review, the cable, counts; it is not in the top 10, so Hit@10 is 0 even though the list found two later reviews. Next items: all four hidden products count; two are in the top 10, so Recall@10 is 2 divided by 4, 0.50. Next item uses leave-last-out; next items trains before 1 January 2022 and hides the first up to 10 new products reviewed in 2022. In that year 557 thousand Electronics shoppers are scored, with 2.13 hidden products on average and 48.2 percent with two or more.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f7f7f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>

  <text class="title" x="90" y="94">Hit@10 scores the next review; Recall@10 the next year</text>

  <!-- ═════════ 1 Shopper and list ═════════ -->
  <g transform="translate(90 136)" id="c1">
    <rect class="card" width="1740" height="336" rx="20"/>
    <circle cx="40" cy="44" r="22" fill="#1a6bb8"/><text class="num" x="40" y="53" text-anchor="middle">1</text>
    <text class="head" x="76" y="55">One shopper, one top-10 list from the model</text>

    <line x1="600" y1="92" x2="600" y2="188" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="600" y="84" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#1a1a1a">now</text>
    <text class="small" x="295" y="186" text-anchor="middle">the model sees these</text>
    <text class="small" x="1030" y="186" text-anchor="middle" style="fill:#1a1a1a;font-weight:700">hidden: what the shopper reviews next</text>

    <text class="text" x="40" y="258" style="font-weight:700">Model’s top 10:</text>
    <text class="small" x="240" y="318">further down: <tspan font-weight="700" fill="#1a1a1a">#14 Cable</tspan> · <tspan font-weight="700" fill="#1a1a1a">#31 Tripod</tspan>  (the model ranks all 368K products)</text>
  </g>

  <!-- ═════════ 2 Next item ═════════ -->
  <g transform="translate(90 492)" id="c2">
    <rect class="card" width="855" height="516" rx="20"/>
    <circle cx="40" cy="44" r="22" fill="#1a6bb8"/><text class="num" x="40" y="53" text-anchor="middle">2</text>
    <text class="head" x="76" y="55">Next item → Hit@10</text>

    <text x="700" y="140" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#595959">Hit@10</text>
    <text x="700" y="236" text-anchor="middle" style="font-size:96px;font-weight:700;fill:#1a1a1a">0</text>
    <text class="small" x="700" y="276" text-anchor="middle">next review not in top 10</text>

    <text class="text" x="40" y="344">1 if the <tspan font-weight="700">next</tspan> review is in the top 10, else 0.</text>
    <text class="muted" x="40" y="380">Charger (#2) and Mouse (#7) come later: no credit.</text>
    <rect x="40" y="404" width="775" height="88" rx="12" fill="#fff" stroke="#c8c8c8" stroke-width="1.5"/>
    <text class="small" x="60" y="438" style="fill:#1a1a1a"><tspan font-weight="700">How we hide it:</tspan> each shopper’s last review is the test;</text>
    <text class="small" x="60" y="470" style="fill:#1a1a1a">the second-last tunes settings (leave-last-out).</text>
  </g>

  <!-- ═════════ 3 Next items ═════════ -->
  <g transform="translate(975 492)" id="c3">
    <rect class="card" width="855" height="516" rx="20"/>
    <circle cx="40" cy="44" r="22" fill="#1a6bb8"/><text class="num" x="40" y="53" text-anchor="middle">3</text>
    <text class="head" x="76" y="55">Next items → Recall@10</text>

    <text x="700" y="140" text-anchor="middle" style="font-size:30px;font-weight:700;fill:#595959">Recall@10</text>
    <text x="700" y="236" text-anchor="middle" style="font-size:96px;font-weight:700;fill:#1a6bb8">0.50</text>
    <text class="small" x="700" y="276" text-anchor="middle">2 found ÷ 4 hidden</text>

    <text class="text" x="40" y="344">Hidden products in the top 10 ÷ min(10, number hidden).</text>
    <text class="muted" x="40" y="380">The list gets credit for the chain, in any order.</text>
    <rect x="40" y="404" width="775" height="88" rx="12" fill="#fff" stroke="#c8c8c8" stroke-width="1.5"/>
    <text class="small" x="60" y="438" style="fill:#1a1a1a"><tspan font-weight="700">How we hide it:</tspan> train on reviews before 1 Jan 2022; hide the</text>
    <text class="small" x="60" y="470" style="fill:#1a1a1a">first ≤ 10 new products reviewed in 2022. Tune: one year earlier.</text>
  </g>

  <text x="90" y="1040" class="small" style="fill:#1a1a1a"><tspan font-weight="700">Why it matters:</tspan> in the 2022 test year, 557K Electronics shoppers are scored, with 2.13 hidden products on average; 48.2% have 2 or more.</text>
  <text x="90" y="1070" class="small" style="font-style:italic">Study not yet run · NDCG@10 only breaks ties · with one hidden product, Hit@10 = Recall@10 · example shopper and ranks illustrative</text>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const el = (tag, attrs, parent, text) => {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (text !== undefined) e.textContent = text;
      parent.appendChild(e); return e;
    };
    const arrow = (p, x1, y, x2) => el('line', { x1, y1: y, x2, y2: y, stroke: '#7f7f7f', 'stroke-width': 3, 'marker-end': 'url(#ah)' }, p);

    // 1: timeline and top-10 list
    const c1 = document.getElementById('c1');
    const past = ['Laptop', 'Phone', 'Case'];
    past.forEach((n, i) => {
      const x = 40 + i * 180;
      el('rect', { x, y: 104, width: 150, height: 50, rx: 25, fill: '#1a6bb8' }, c1);
      el('text', { x: x + 75, y: 137, 'text-anchor': 'middle', style: 'font-size:24px;font-weight:700;fill:#fff' }, c1, n);
      if (i < past.length - 1) arrow(c1, x + 154, 129, x + 174);
    });
    const future = [['Cable', '1st'], ['Charger', '2nd'], ['Tripod', '3rd'], ['Mouse', '4th']];
    future.forEach(([n, o], i) => {
      const x = 650 + i * 190;
      el('rect', { x, y: 104, width: 150, height: 50, rx: 25, fill: '#1a1a1a' }, c1);
      el('text', { x: x + 75, y: 137, 'text-anchor': 'middle', style: 'font-size:24px;font-weight:700;fill:#fff' }, c1, n);
      el('text', { x: x + 75, y: 96, 'text-anchor': 'middle', style: 'font-size:20px;fill:#595959' }, c1, o);
      if (i < future.length - 1) arrow(c1, x + 154, 129, x + 184);
    });

    const top10 = ['Earbuds', 'Charger', 'Speaker', 'Keyboard', 'Webcam', 'HDMI', 'Mouse', 'SD card', 'Monitor', 'Stand'];
    const hidden = new Set(['Charger', 'Mouse']);
    top10.forEach((n, i) => {
      const x = 240 + i * 142, h = hidden.has(n);
      el('rect', { x, y: 226, width: 134, height: 50, rx: 8, fill: h ? '#1a1a1a' : '#fff',
        stroke: h ? '#1a1a1a' : '#bfbfbf', 'stroke-width': 2 }, c1);
      el('text', { x: x + 12, y: 258, style: `font-size:20px;font-weight:700;fill:${h ? '#fff' : '#595959'}` }, c1, `#${i + 1}`);
      el('text', { x: x + (i === 9 ? 58 : 48), y: 258, style: `font-size:20px;font-weight:${h ? 700 : 400};fill:${h ? '#fff' : '#1a1a1a'}` }, c1, n);
    });

    // 2 and 3: which hidden products are scored
    const RANK = { Cable: 14, Charger: 2, Tripod: 31, Mouse: 7 };
    function scoreRows(id, scored) {
      const g = document.getElementById(id);
      el('text', { x: 40, y: 104, style: 'font-size:22px;fill:#595959' }, g, 'hidden review');
      el('text', { x: 300, y: 104, style: 'font-size:22px;fill:#595959' }, g, 'rank');
      future.forEach(([n, o], i) => {
        const y = 118 + i * 48, on = scored(i), found = RANK[n] <= 10;
        const op = on ? 1 : 0.3;
        el('text', { x: 40, y: y + 29, style: `font-size:20px;fill:#595959;opacity:${op}` }, g, o);
        el('rect', { x: 90, y, width: 150, height: 40, rx: 20, fill: '#1a1a1a', opacity: op }, g);
        el('text', { x: 165, y: y + 27, 'text-anchor': 'middle', style: `font-size:21px;font-weight:700;fill:#fff;opacity:${op}` }, g, n);
        el('text', { x: 300, y: y + 28, style: `font-size:24px;font-weight:700;fill:#1a1a1a;opacity:${op}` }, g, `#${RANK[n]}`);
        const mark = !on ? 'not scored' : found ? '✓ in top 10' : '✗ miss';
        const colour = !on ? '#9e9e9e' : found ? '#1a6bb8' : '#1a1a1a';
        el('text', { x: 370, y: y + 28, style: `font-size:22px;font-weight:700;fill:${colour}` }, g, mark);
      });
    }
    scoreRows('c2', i => i === 0);
    scoreRows('c3', () => true);
  </script>
</svg>
</body>
</html>
